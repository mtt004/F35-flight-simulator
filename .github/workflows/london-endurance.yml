name: London endurance qualification
on:
  push:
    branches: ['qa/london-endurance-v0.3']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: london-endurance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci
      - name: Reconstruct and verify licensed offline scenery
        run: |
          python3 -m venv .tmp/london-venv
          .tmp/london-venv/bin/pip install -r scripts/london-requirements.txt
          .tmp/london-venv/bin/python scripts/build-london.py
          .tmp/london-venv/bin/python scripts/build-london-ground.py
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Network-disabled startup before sustained flight
        run: node scripts/test-offline.mjs dist/index.html
      - name: Complete twenty-minute London flight observation
        run: node scripts/endurance-london.mjs dist/index.html
      - name: Source-bound London visual captures
        run: node scripts/capture-london.mjs dist/index.html after
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: london-endurance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            benchmarks/london-v0.3/endurance.json
            benchmarks/final/offline-file-test.json
            screenshots/london-v0.3/after/
            dist/build-manifest.json
            scenery-packs/london/manifest.json
