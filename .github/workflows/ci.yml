name: Browser CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci
      - name: Rebuild pinned licensed London scenery
        run: |
          python3 -m venv .tmp/london-venv
          .tmp/london-venv/bin/pip install -r scripts/london-requirements.txt
          .tmp/london-venv/bin/python scripts/build-london.py
          .tmp/london-venv/bin/python scripts/build-london-ground.py
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-browser.mjs dist/index.html
      - name: London scenery, takeoff and recovery regression
        run: node scripts/test-london.mjs dist/index.html
      - name: Saved flight, repeated replay and malformed-record recovery through actual UI
        run: node scripts/test-flight-lifecycle.mjs dist/index.html --label=ci-flight-integrity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-verification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/
            benchmarks/
            screenshots/
